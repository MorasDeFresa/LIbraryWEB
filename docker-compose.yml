version: "3.9"
services:
  web:
    container_name: BuhoTeca
    build: .
    ports:
      - "3000:3000"
    links:
      - BuhoTeca_DataBase
  BuhoTeca_DataBase:
    image: mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${mongo_user}
      - MONGO_INITDB_ROOT_PASSWORD=${mongo_password}
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
